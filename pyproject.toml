[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinellens"
version = "0.1.0"
description = "Educational AI-assisted SOC triage tool (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "anthropic",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
